<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2600" viewBox="0 0 1000 2600">
    <!-- Motivo per gli schermi medi (tablet, portatili piccoli): copre tutta la larghezza
         della pagina e si ripete verso il basso. I cerchi sono sparsi a x diverse e molti
         stanno al centro, dove passano sotto alle card.
         In alto ci sono solo due cerchi che spuntano dai bordi, per non coprire il titolo. -->
    <defs>
        <linearGradient id="sfumatura" x1="0" y1="1" x2="1" y2="0">
            <stop offset="30%" stop-color="#D14124" />
            <stop offset="70%" stop-color="#93021F" />
        </linearGradient>
    </defs>

    <!-- In alto: spuntano appena dai bordi -->
    <circle cx="-100" cy="140" r="100" fill="none" stroke="url(#sfumatura)" stroke-width="18" opacity="0.9" />
    <circle cx="1095" cy="70" r="100" fill="none" stroke="url(#sfumatura)" stroke-width="18" opacity="0.9" />

    <!-- Più in basso: sparsi lungo la pagina -->
    <circle cx="620" cy="650" r="120" fill="none" stroke="url(#sfumatura)" stroke-width="20" opacity="0.9" />
    <circle cx="150" cy="1050" r="70" fill="none" stroke="#D14124" stroke-width="14" opacity="0.8" />
    <circle cx="880" cy="1350" r="95" fill="none" stroke="url(#sfumatura)" stroke-width="18" opacity="0.9" />
    <circle cx="380" cy="1750" r="140" fill="none" stroke="url(#sfumatura)" stroke-width="22" opacity="0.9" />
    <circle cx="760" cy="2150" r="60" fill="none" stroke="#D14124" stroke-width="14" opacity="0.8" />
    <circle cx="40" cy="2400" r="110" fill="none" stroke="url(#sfumatura)" stroke-width="20" opacity="0.9" />
</svg>
